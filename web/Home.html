
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app">

<section class="home">


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            RealTime Forum
        </div>


        <div class="nav-links">

            <button>
                Chat
            </button>


            <button class="active">
                Home
            </button>


            <button>
                Create Post
            </button>

        </div>


        <div class="user">

            Mohammed

        </div>


    </nav>




    <div class="home-layout">


        <!-- Sidebar -->

        <aside class="sidebar">


            <h3>
                Filter
            </h3>


            <input
                type="search"
                placeholder="Search posts..."
            >



            <div class="filter-group">

                <h4>
                    Categories
                </h4>


                <label>

                    <input type="checkbox">

                    Technology

                </label>


                <label>

                    <input type="checkbox">

                    Programming

                </label>


                <label>

                    <input type="checkbox">

                    Gaming

                </label>


                <label>

                    <input type="checkbox">

                    News

                </label>


            </div>




            <div class="filter-group">


                <h4>
                    Sort
                </h4>


                <select>

                    <option>
                        Latest
                    </option>


                    <option>
                        Most liked
                    </option>


                    <option>
                        Most commented
                    </option>


                </select>


            </div>



        </aside>





        <!-- Posts -->

        <main class="feed">


            <h2>
                Latest Posts
            </h2>



            <article class="post-card">


                <div class="post-header">


                    <div>

                        <h3>
                            Building WebSocket Chat
                        </h3>


                        <span>
                            by Mohammed
                        </span>

                    </div>


                    <span>
                        2h ago
                    </span>


                </div>




                <p>

                    Today I implemented real time
                    communication using Go and WebSocket.

                </p>



                <div class="post-category">

                    Programming

                </div>




                <div class="post-actions">


                    <button>
                        ❤️ Like
                    </button>


                    <button>
                        💬 Comments
                    </button>


                </div>


            </article>





            <article class="post-card">


                <div class="post-header">


                    <h3>
                        My first Go project
                    </h3>


                </div>



                <p>

                    Learning backend architecture
                    with clean architecture.

                </p>


                <div class="post-actions">


                    <button>
                        ❤️ Like
                    </button>


                    <button>
                        💬 Comments
                    </button>


                </div>


            </article>



        </main>



    </div>



</section>


</div>
    
</body>
</html>
