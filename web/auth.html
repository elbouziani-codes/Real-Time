
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Real Time Forum</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages/auth.css">
</head>

<body>

<div id="app">

    <section class="auth">

        <div class="auth-left">

            <h1>Real-Time Forum</h1>

            <p>
                Join discussions with developers around the world.
            </p>

        </div>

        <div class="auth-right">

            <div class="card">

                <div class="tabs">

                    <button
                        id="loginTab"
                        class="active"
                    >
                        Login
                    </button>

                    <button
                        id="registerTab"
                    >
                        Register
                    </button>

                </div>

                <!-- LOGIN -->

                <form id="loginForm">

                    <h2>Welcome Back</h2>

                    <input
                        type="text"
                        placeholder="Nickname or Email"
                        id="loginIdentifier"
                    >

                    <input
                        type="password"
                        placeholder="Password"
                        id="loginPassword"
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>

                <!-- REGISTER -->

                <form
                    id="registerForm"
                    class="hidden"
                >

                    <h2>Create Account</h2>

                    <input
                        type="text"
                        placeholder="Nickname"
                        id="nickname"
                    >

                    <input
                        type="text"
                        placeholder="First Name"
                        id="firstName"
                    >

                    <input
                        type="text"
                        placeholder="Last Name"
                        id="lastName"
                    >

                    <input
                        type="number"
                        placeholder="Age"
                        id="age"
                    >

                    <select id="gender">

                        <option value="">
                            Gender
                        </option>

                        <option>Male</option>

                        <option>Female</option>

                    </select>

                    <input
                        type="email"
                        placeholder="Email"
                        id="email"
                    >

                    <input
                        type="password"
                        placeholder="Password"
                        id="password"
                    >

                    <button type="submit">
                        Register
                    </button>

                </form>

            </div>

        </div>

    </section>

</div>

<script src="js/app.js"></script>

</body>
</html>
