<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h2>WebSocket Test Client</h2>

<div id="messages"></div>

<input id="receiver" placeholder="Receiver UUID">
<br>

<input id="content" placeholder="Message">
<button onclick="sendMessage()">Send</button>

<button onclick="sendTyping()">Typing</button>

<script>

let ws;

function connect() {

    ws = new WebSocket(
        "ws://localhost:8080/ws/chat"
    );


    ws.onopen = () => {
        log("Connected");
    };


    ws.onmessage = (event) => {

        log("SERVER: " + event.data);

    };


    ws.onclose = () => {
        log("Disconnected");
    };


    ws.onerror = (err) => {
        log("ERROR");
        console.log(err);
    };
}


function sendMessage() {

    const receiver = document.getElementById("receiver").value;
    const content = document.getElementById("content").value;


    const request = {
        request_type: "message",

        request_body: {
            receiver_id: receiver,
            content: content
        },

        destination: receiver
    };


    ws.send(JSON.stringify(request));
}



function sendTyping() {

    const receiver = document.getElementById("receiver").value;


    const request = {
        request_type: "typing",

        request_body: true,

        destination: receiver
    };


    ws.send(JSON.stringify(request));
}



function log(message){

    const box = document.getElementById("messages");

    box.innerHTML += "<div>"+message+"</div>";

    box.scrollTop = box.scrollHeight;
}


connect();

</script>

</body>
</html>
